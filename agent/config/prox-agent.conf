[agent]
# Intervall des Daemons in Sekunden
interval = 60
# Zu ueberwachende systemd-Dienste (Komma-getrennt)
services = ssh, sshd, cron, chronyd, systemd-timesyncd, qemu-guest-agent
# HTTP-Endpunkt (Standard: deaktiviert, port = 0). Bei Nicht-localhost ist ein Token Pflicht.
bind = 127.0.0.1
port = 0
token =
# JSON-Snapshot
output_file = /var/lib/prox-agent/info.json
# Optional: menschenlesbare Datei, z.B. /srv/info/host.info
host_info_file =
# Timeout pro Plugin in Sekunden
plugin_timeout = 10
