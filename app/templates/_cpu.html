{% macro cpu_bar(v) %}{% set p = v|cpu_pct %}{% if p is none %}<span class="cpu-bar na" title="CPU nicht verfügbar"><span class="cpu-track"></span><span class="cpu-label">CPU -</span></span>{% else %}<span class="cpu-bar {{ 'high' if p >= 90 else ('mid' if p >= 70 else '') }}" title="CPU-Last {{ p }} %"><span class="cpu-track" role="progressbar" aria-label="CPU-Last" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ p }}"><span class="cpu-fill" style="width:{{ p }}%"></span></span><span class="cpu-label">CPU {{ p }} %</span></span>{% endif %}{% endmacro %}
