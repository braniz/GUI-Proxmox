<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxmox Viewer</title>
<style>
body{font-family:sans-serif;margin:0;background:#f4f5f7;color:#222}
nav{background:#2b2d42;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center}
nav a,nav button{color:#fff;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
nav form{margin-left:auto}
main{padding:1rem 2rem}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #ddd;padding:.4rem .6rem;text-align:left}
th{background:#e9ecef}
.error,.flash{background:#fde2e2;padding:.6rem;border-radius:4px;margin-bottom:1rem}
.login{max-width:320px;margin:4rem auto;background:#fff;padding:1.5rem;border-radius:6px}
.login input{width:100%;box-sizing:border-box;margin:.3rem 0 .8rem;padding:.4rem}
.tree{list-style:none;padding:0;margin:0}
.tree details{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:1rem}
.tree summary{cursor:pointer;padding:.7rem 1rem;font-weight:600;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.tree .meta{font-weight:400;color:#555;font-size:.9rem}
.tree ul{list-style:none;margin:0 0 .5rem 1.6rem;padding:0 1rem .3rem 1rem;border-left:2px solid #c5cae9}
.tree li{position:relative;padding:.35rem .6rem;display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem;align-items:start}.tree .col{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;min-width:0}
.tree li::before{content:"";position:absolute;left:-1rem;top:50%;width:.8rem;border-top:2px solid #c5cae9}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.8rem;color:#fff;background:#868e96}
.badge.ok{background:#2f9e44}.badge.bad{background:#e03131}.badge.type{background:#4263eb}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-bottom:1rem}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:1rem}
.card h2{margin-top:0;font-size:1.1rem}
.warn{background:#fff3bf;padding:.6rem;border-radius:4px;margin-bottom:.5rem}
.tree .comment{margin-top:.3rem;display:flex;gap:.5rem;align-items:flex-start}.tree .comment textarea{flex:1;font:inherit}.tree .extra pre{white-space:pre-wrap;background:#f4f5f7;padding:.5rem;margin:.3rem 0}
.tree .meta{color:#343a40}.tree li{padding:.7rem .6rem;line-height:1.5;border-bottom:1px solid #d0d4da}.tree li:last-child{border-bottom:0}.tree li:nth-child(even){background:#f1f3f9}
.tree .col+.col{border-left:1px solid #d0d4da;padding-left:.7rem}.tree .col-status .meta{font-weight:600}.tree .extra>summary{cursor:pointer;font-weight:600;color:#364fc7;padding:.1rem 0}
.tree .extra pre{background:#fff;color:#212529;border:1px solid #ced4da;border-radius:4px;padding:.6rem;line-height:1.45}.tree .comment textarea{background:#fff;color:#212529;border:1px solid #adb5bd;border-radius:4px;padding:.3rem}
.kanban-column{background:#e9ecef;border-radius:8px;padding:.8rem;min-width:220px;flex:1}
.kanban-column h3{margin:.1rem 0 .8rem;font-size:1rem}
.todo-columns,.vm-columns{display:flex;gap:1rem;align-items:flex-start;overflow-x:auto;margin:1rem 0 2rem}
.kanban-card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:.8rem;margin-bottom:.7rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.todo-card{cursor:grab}.todo-card:active{cursor:grabbing}.kanban-card small{flex-basis:100%;color:#555}
.todo-card p{flex-basis:100%;white-space:pre-wrap;margin:.2rem 0}.todo-card .todo-actions{display:flex;gap:.4rem;margin-left:auto}.bulk-toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0}.todo-history{flex-basis:100%}.select-all{font-size:.85rem}#action-dialog textarea,#action-dialog input,#action-dialog select{width:100%}
.todo-heading,.dialog-actions{display:flex;gap:.6rem;align-items:center;justify-content:space-between}
.todo-heading h2{margin-bottom:0}.host-info pre{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:0}
#add-todo{order:-1;background:#2ecc71;color:#000;border:2px solid #000;font-weight:600}#add-todo:hover{background:#27ae60;color:#000}
.todo-heading{justify-content:flex-start}
#todo-dialog{border:0;border-radius:8px;padding:1.2rem;width:min(460px,calc(100% - 3rem));box-shadow:0 4px 20px rgba(0,0,0,.25)}
#todo-dialog::backdrop{background:rgba(0,0,0,.45)}#todo-form{display:grid;gap:.5rem}#todo-form h2{margin:.2rem 0}
#todo-form input,#todo-form textarea,#todo-form select{font:inherit;padding:.45rem}.dialog-actions{justify-content:flex-end;margin-top:.6rem}
.tree .col-extra{display:block}.tree .col-extra>.extra{width:100%;box-sizing:border-box}.tree .extra pre{width:100%;box-sizing:border-box;max-width:none}.tree .extra .comment textarea{min-width:0}
.hover-card{position:relative;display:inline-block}.hostname{display:inline-block;padding:.1rem .6rem;border:2px solid #364fc7;border-radius:6px;background:#fff;color:#212529;cursor:help}a.hostname,button.hostname{font:inherit;cursor:pointer;text-decoration:none}.guest-info{display:block;margin-top:.4rem}.guest-info pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:.2rem 0}.hostname:focus{outline:2px solid #1c7ed6;outline-offset:2px}
.hover-content{display:none;position:fixed;z-index:10;margin-top:.3rem;width:max-content;max-width:min(320px,80vw);max-height:14rem;overflow:auto;background:#fff;color:#212529;border:1px solid #ced4da;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:.5rem;font-size:.85rem}
.hover-content pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.hover-card:hover .hover-content,.hover-card:focus-within .hover-content{display:block}
.vm-columns{padding-bottom:12rem}
.empty{color:#666;font-size:.9rem}
@media(max-width:600px){main{padding:.6rem}.tree ul{margin-left:.5rem}}
@media(max-width:800px){.tree li{grid-template-columns:1fr}.tree .col+.col{border-left:0;padding-left:0}}
</style></head><body>
{% if session.user %}
<nav><a href="{{ url_for('overview') }}">Übersicht</a><a href="{{ url_for('nodes') }}">Nodes</a>
<a href="{{ url_for('guests') }}">VMs / Container</a><a href="{{ url_for('storage') }}">Storage</a>
<a href="{{ url_for('status') }}">Status</a><a href="{{ url_for('kanban') }}">Kanban</a><a href="{{ url_for('services') }}">Dienstüberwachung</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button>Logout</button></form></nav>
{% endif %}
<main>{% if error %}<div class="error">{{ error }}</div>{% endif %}{% block content %}{% endblock %}</main>
</body></html>
